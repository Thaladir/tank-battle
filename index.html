<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>超级坦克大战 · Tank Battalion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101310;
        --panel: #1a1e19;
        --line: #414637;
        --muted: #a6ac9b;
        --gold: #f6c642;
        --white: #f3f0db;
        --mono: "Courier New", monospace;
        --cn: "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--white);
        background-color: var(--bg);
        background-image:
          linear-gradient(#a4b49407 1px, transparent 1px),
          linear-gradient(90deg, #a4b49407 1px, transparent 1px);
        background-size: 32px 32px;
        font:
          14px var(--mono),
          var(--cn);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #fbe073;
        outline-offset: 3px;
      }
      button:disabled {
        cursor: default;
      }
      button {
        border: 0;
      }
      #shell {
        max-width: 1100px;
        margin: auto;
        padding: 0 34px;
      }
      header {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .brand,
      .tools,
      .status,
      .keytip,
      .hudhead,
      .eyebrow,
      .panelhead,
      .foot,
      .playerhead {
        display: flex;
        align-items: center;
      }
      .brand {
        gap: 13px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }
      .brand small {
        display: block;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 2px;
        margin-top: 1px;
      }
      .logobox {
        background: var(--gold);
        width: 43px;
        height: 43px;
        display: grid;
        place-items: center;
        box-shadow: inset 0 -4px #ad8a32;
      }
      .tools {
        gap: 9px;
      }
      .status {
        gap: 8px;
        font-size: 10px;
        letter-spacing: 1px;
        color: #b7c1ae;
        margin-right: 10px;
      }
      .led {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #a6c979;
        box-shadow: 0 0 7px #94b86955;
      }
      .utility,
      .minor {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #20241e;
        border: 1px solid var(--line);
        padding: 8px 12px;
        color: #d4d8c6;
        font-size: 12px;
      }
      .utility:hover,
      .minor:hover {
        background: #33392c;
      }
      .utility canvas {
        width: 15px;
        height: 15px;
      }
      canvas {
        image-rendering: pixelated;
      }
      .cabinet {
        margin: 25px 0 0;
        border: 1px solid #555948;
        background: var(--panel);
        padding: 5px;
        box-shadow:
          0 9px 0 #0b0e0bd9,
          0 20px 60px #0003;
        position: relative;
      }
      .hero {
        position: relative;
        isolation: isolate;
        height: clamp(292px, 30vw, 338px);
        overflow: hidden;
        background: #363c2a;
      }
      .hero canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        z-index: -2;
      }
      .hero:after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, #101711d9, #181c0f66 37%, transparent 62%),
          repeating-linear-gradient(0deg, #00000012 0 1px, transparent 1px 4px);
        pointer-events: none;
      }
      .heroCopy {
        position: absolute;
        left: 4.1%;
        top: 13%;
      }
      .eyebrow {
        gap: 9px;
        font-size: 10px;
        letter-spacing: 2.5px;
        font-weight: bold;
        color: #f6d061;
      }
      .eyebrow:before {
        content: "";
        width: 24px;
        height: 5px;
        background: repeating-linear-gradient(115deg, var(--gold) 0 3px, transparent 3px 6px);
      }
      h1 {
        margin: 16px 0 8px;
        font: 1000 clamp(48px, 5.4vw, 72px) / 1.04 var(--cn);
        letter-spacing: 3px;
        text-shadow:
          3px 3px #514c32,
          6px 6px #151b12;
      }
      h1 span {
        display: block;
        color: var(--gold);
        animation: titleglow 4s infinite;
      }
      @keyframes titleglow {
        0%,
        90%,
        95%,
        100% {
          color: var(--gold);
        }
        92%,
        97% {
          color: #ffda70;
        }
      }
      .english {
        font-size: 13px;
        letter-spacing: 4px;
        font-weight: bold;
        color: #dfdfbc;
      }
      .heroLabel {
        position: absolute;
        right: 20px;
        bottom: 13px;
        font-size: 10px;
        background: #151a13df;
        color: #ccd2ab;
        padding: 5px 8px;
        letter-spacing: 1px;
      }
      .heroLabel i {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--gold);
        margin-right: 6px;
        animation: blink 2s infinite;
      }
      .menuBody {
        padding: 23px 24px 21px;
        border-top: 4px solid #373e2f;
      }
      .panelhead {
        gap: 12px;
        margin-bottom: 16px;
      }
      .panelhead h2 {
        margin: 0;
        font: 800 20px var(--cn);
        letter-spacing: 2px;
      }
      .panelhead .slashes {
        color: var(--gold);
        letter-spacing: -2px;
        font-weight: 900;
        font-size: 21px;
      }
      .enlabel {
        color: #a5af99;
        font-size: 10px;
        letter-spacing: 1.6px;
      }
      .panelhead:after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
        margin-left: 5px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .mode {
        --accent: #9fbbc4;
        text-align: left;
        background: #222720;
        border: 1px solid #495042;
        position: relative;
        padding: 14px 16px 15px;
        transition: background 0.13s;
        min-height: 118px;
      }
      .mode:first-child {
        --accent: var(--gold);
      }
      .mode:nth-child(2) {
        --accent: #8fc6d0;
      }
      .mode:nth-child(3) {
        --accent: #a5b48c;
      }
      .mode.sel {
        border-color: var(--gold);
        background: linear-gradient(115deg, #393725, #2c2d21);
        box-shadow: inset 3px 0 var(--gold);
      }
      .modeTop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .modeTop span {
        color: var(--accent);
        font-size: 10px;
        letter-spacing: 1px;
        border: 1px solid #80896a55;
        padding: 2px 5px;
      }
      .mode canvas {
        width: 34px;
        height: 24px;
      }
      .mode strong {
        display: block;
        font: 800 20px var(--cn);
        letter-spacing: 1px;
      }
      .mode small {
        display: block;
        font-size: 10px;
        color: #aeb6a2;
        letter-spacing: 1.3px;
        margin-top: 4px;
      }
      .go {
        font-style: normal;
        position: absolute;
        right: 15px;
        bottom: 17px;
        color: #838c78;
        font-size: 18px;
      }
      .sel .go {
        color: var(--gold);
        animation: blink 2s infinite;
      }
      .foot {
        margin: 0 24px;
        border-top: 1px solid var(--line);
        padding: 13px 0 9px;
        justify-content: space-between;
        color: #a4ad99;
        font-size: 11px;
      }
      .foot > div,
      .keytip {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .foot .keytip {
        margin-right: 8px;
      }
      kbd {
        display: inline-grid;
        place-items: center;
        min-width: 19px;
        padding: 2px 4px;
        border: 1px solid #545c4c;
        border-bottom-width: 2px;
        background: #252a22;
        color: #d8ddc9;
        font: 10px var(--mono);
        border-radius: 2px;
      }
      .outerFoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #848d7c;
        font-size: 10px;
        letter-spacing: 1.3px;
        margin: 18px 1px 24px;
      }
      .stripes {
        width: 54px;
        height: 8px;
        background: repeating-linear-gradient(120deg, #67705b 0 3px, transparent 3px 6px);
      }
      [hidden] {
        display: none !important;
      }
      @keyframes blink {
        50% {
          opacity: 0.64;
        }
      }
      #viewport {
        position: relative;
        margin: 23px auto 0;
        overflow: hidden;
      }
      #game {
        position: absolute;
        width: 1032px;
        height: 672px;
        display: flex;
        transform-origin: top left;
        outline: 1px solid var(--line);
      }
      #field {
        object-fit: contain;
        width: 832px;
        height: 672px;
        background: #262c22;
      }
      #hud {
        width: 200px;
        padding: 20px 14px;
        background: #1c201b;
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hudhead {
        font-size: 13px;
        letter-spacing: 2px;
        font-weight: bold;
        color: var(--gold);
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }
      .playerhead {
        gap: 8px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      .playerhead canvas {
        width: 32px;
        height: 26px;
      }
      .hpval {
        margin: 8px 0 4px;
        color: #d0d6c4;
        font-size: 12px;
      }
      .hpbar {
        height: 10px;
        background: #563733;
      }
      .hpbar i {
        height: 100%;
        display: block;
        background: repeating-linear-gradient(90deg, #97b97e 0 8px, #7c9a67 8px 10px);
      }
      .upgrades {
        font-size: 12px;
        line-height: 1.7;
        min-height: 28px;
        color: var(--muted);
        margin-top: 8px;
      }
      .score {
        text-align: center;
        border-block: 1px solid var(--line);
        padding: 13px 0;
        color: var(--gold);
      }
      .score b {
        font-size: 31px;
        display: block;
      }
      .score small {
        font-size: 11px;
      }
      .rounddots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 7px;
      }
      .rounddots i {
        width: 10px;
        height: 10px;
        border: 1px solid #647058;
        border-radius: 50%;
      }
      .hudbottom {
        margin-top: auto;
        font-size: 11px;
        color: var(--muted);
        display: grid;
        gap: 10px;
      }
      .blur {
        filter: blur(3px);
      }
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #080c08bd;
        display: grid;
        place-items: center;
        padding: 18px;
        overflow: auto;
      }
      .dialog {
        max-width: 100%;
        width: 465px;
        max-height: 94vh;
        overflow: auto;
        background: #20251e;
        border: 1px solid #7e866a;
        box-shadow:
          0 5px 0 #0b0e09,
          0 0 0 5px #191e16;
        padding: 27px;
        position: relative;
      }
      .dialog:before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 56px;
        height: 4px;
        background: var(--gold);
      }
      .dialog h2 {
        font: 900 30px var(--cn);
        margin: 9px 0 18px;
      }
      .dialog p {
        color: #bbc2ae;
        line-height: 1.7;
      }
      .rowbtn,
      .primary {
        width: 100%;
        border: 1px solid #59624e;
        background: #2a3027;
        padding: 12px 14px;
        text-align: left;
        margin-top: 7px;
        font-weight: bold;
      }
      .rowbtn small {
        display: block;
        color: #adb6a1;
        font-weight: normal;
        margin-top: 3px;
      }
      .rowbtn:hover,
      .rowbtn:focus-visible {
        border-color: var(--gold);
        background: #373927;
      }
      .primary {
        background: var(--gold);
        color: #262718;
        text-align: center;
        border-color: var(--gold);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .actions > * {
        flex: 1;
      }
      .dialog label {
        display: block;
        color: #ccd2c0;
        margin: 13px 0 5px;
        font-size: 12px;
      }
      .dialog input {
        width: 100%;
        background: #131811;
        border: 1px solid #57604e;
        color: var(--white);
        padding: 10px;
      }
      .notice {
        min-height: 16px;
        color: var(--gold);
        font-size: 12px;
        line-height: 1.6;
        margin-top: 10px;
      }
      .helpTable {
        width: 100%;
        border-collapse: collapse;
      }
      .helpTable td,
      .helpTable th {
        border-bottom: 1px solid var(--line);
        text-align: left;
        padding: 9px 4px;
      }
      .dialog.wide {
        width: 1080px;
      }
      .drafts {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .drafts section {
        flex: 1;
        min-width: min(100%, 425px);
      }
      .drafts h3 {
        font-size: 14px;
        color: var(--gold);
      }
      .picks {
        display: flex;
        gap: 7px;
      }
      .perk {
        flex: 1;
        max-width: 160px;
        height: 220px;
        background: #282b3a;
        color: #e2e3dd;
        border: 2px solid #565b70;
        padding: 12px 7px;
        transition: transform 0.15s;
        text-align: center;
      }
      .perk span,
      .perk b,
      .perk small {
        display: block;
      }
      .perk span {
        font-size: 35px;
        margin: 16px 0;
      }
      .perk small {
        font-size: 12px;
        line-height: 1.6;
        margin-top: 10px;
        color: #c2c4cf;
      }
      .perk.cursor {
        transform: scale(1.05);
        border-color: var(--gold);
      }
      .drafts section:nth-child(2) .perk.cursor {
        border-color: #83c6dc;
      }
      .perk:focus-visible {
        outline: 2px dashed #ccd1bd;
      }
      .perk:not(:disabled):hover {
        background: #35394a;
      }
      .perk.chosen {
        animation: flash 0.45s;
        background: #304033;
        border-color: #92b785;
      }
      @keyframes flash {
        50% {
          background: #997e36;
        }
      }
      .count {
        float: right;
        color: var(--gold);
      }
      .resultscore {
        font-size: 48px;
        color: var(--gold);
        text-align: center;
        margin: 16px;
      }
      .hint {
        color: #a4af99;
        font-size: 11px;
        line-height: 1.6;
      }
      .roomnum {
        font-size: 40px;
        letter-spacing: 8px;
        color: var(--gold);
      }
      /* ── 街机风格角标装饰 ──────────────────────────── */
      .corner {
        position: absolute;
        width: 18px;
        height: 18px;
        z-index: 3;
        pointer-events: none;
      }
      .corner-tl { top: 4px; left: 4px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
      .corner-tr { top: 4px; right: 4px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); }
      .corner-bl { bottom: 4px; left: 4px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); }
      .corner-br { bottom: 4px; right: 4px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }
      /* ── PRESS ENTER 提示 ───────────────────────────── */
      .pressStart {
        margin-top: 20px;
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--gold);
        font-weight: bold;
        animation: pressStartBlink 1.3s step-end infinite;
        display: inline-block;
      }
      @keyframes pressStartBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      /* ── 提示滚动条 ─────────────────────────────────── */
      .ticker {
        background: #0d1110;
        border-bottom: 1px solid #252b22;
        padding: 7px 24px;
        font-size: 10px;
        color: #7e8977;
        letter-spacing: 1.3px;
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 30px;
      }
      .ticker-label {
        color: var(--gold);
        font-size: 9px;
        letter-spacing: 2px;
        font-weight: bold;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .tickerText {
        transition: opacity 0.35s;
        flex: 1;
      }
      .tickerText.fade { opacity: 0; }
      /* ── 卡片选中效果增强 ───────────────────────────── */
      .mode {
        min-height: 198px;
        padding-bottom: 38px;
      }
      .mode.sel {
        border-color: var(--gold);
        background: linear-gradient(115deg, #393725, #2c2d21);
        box-shadow: inset 3px 0 var(--gold), 0 0 20px #f6c64218;
        animation: cardPulse 2.5s ease-in-out infinite;
      }
      @keyframes cardPulse {
        0%, 100% { box-shadow: inset 3px 0 var(--gold), 0 0 12px #f6c64212; }
        50% { box-shadow: inset 3px 0 var(--gold), 0 0 32px #f6c6422a; }
      }
      /* ── 卡片特性列表 ───────────────────────────────── */
      .modeFeats {
        margin: 8px 0 0;
        font-size: 10px;
        color: #6e776a;
        letter-spacing: 0.4px;
        line-height: 1.65;
        list-style: none;
        padding: 0;
      }
      .mode.sel .modeFeats { color: #9fa899; }
      .modeFeats li:before { content: "· "; color: var(--gold); }
      .modeDiff {
        font-size: 9px;
        letter-spacing: 0.5px;
        color: #857842;
        margin-top: 3px;
        font-weight: bold;
      }
      @media (max-width: 700px) {
        #shell {
          padding: 0 12px;
        }
        header {
          height: 64px;
        }
        .status {
          display: none;
        }
        .brand {
          font-size: 15px;
        }
        .brand small {
          font-size: 8px;
        }
        .utility {
          padding: 7px;
        }
        .hero {
          height: 250px;
        }
        .heroCopy {
          left: 5%;
          top: 16%;
        }
        h1 {
          font-size: 44px;
        }
        .english {
          font-size: 10px;
        }
        .menuBody {
          padding: 16px 12px;
        }
        .cards {
          gap: 6px;
        }
        .mode {
          padding: 10px 8px;
          min-height: 112px;
        }
        .mode strong {
          font-size: 16px;
        }
        .mode small {
          font-size: 8px;
          letter-spacing: 0.5px;
        }
        .go {
          display: none;
        }
        .foot {
          margin: 0 12px;
        }
        .foot > span {
          display: none;
        }
        .heroLabel {
          font-size: 8px;
        }
        .outerFoot {
          font-size: 8px;
        }
        .tools {
          gap: 5px;
        }
        .enlabel {
          font-size: 9px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="shell">
      <header>
        <div class="brand">
          <div class="logobox"><canvas data-icon="logo" width="34" height="24"></canvas></div>
          <div>TANK BATTALION<small>街机游戏系统 / ARCADE SYSTEM</small></div>
        </div>
        <div class="tools">
          <span class="status"><i class="led"></i><span id="systemStatus">SYSTEM READY</span></span
          ><button class="utility" id="sound" aria-pressed="true">
            <canvas data-icon="sound" width="16" height="16"></canvas><span>音效</span></button
          ><button class="utility" id="help">
            <canvas data-icon="keys" width="16" height="16"></canvas>操作指南
          </button>
        </div>
      </header>
      <section class="cabinet" id="menu">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
        <div class="hero">
          <canvas
            id="cover"
            width="420"
            height="140"
            aria-label="夕阳下驶过山地的像素坦克"
          ></canvas>
          <div class="heroCopy">
            <div class="eyebrow">ARCADE EDITION</div>
            <h1>超级<span>坦克大战</span></h1>
            <div class="english">SUPER TANK BATTLE</div>
            <div class="pressStart">▶ PRESS ENTER TO START</div>
          </div>
          <div class="heroLabel"><i></i>战场预览 / DEMO</div>
        </div>
        <div class="ticker"><span class="ticker-label">▶ TIP</span><span class="tickerText" id="tickerText">砖墙承受两发炮弹即摧毁；钢墙可反弹炮弹，善用反弹可奇袭对手。</span></div>
        <div class="menuBody">
          <div class="panelhead">
            <span class="slashes">//</span>
            <h2>选择游戏模式</h2>
            <span class="enlabel">MODE SELECT</span>
          </div>

      // ===== 3. 音效系统：在首次交互后启用音频上下文 =====
      let audio = null,

      function wakeAudio() {
        try {
          if (!audio) {

            motor = audio.createOscillator();
            motorGain = audio.createGain();
            motor.type = "sawtooth";
            motor.frequency.value = 36;
            motorGain.gain.value = 0;
            motor.connect(motorGain).connect(audio.destination);
            motor.start();

          if (audio.state === "suspended") audio.resume().catch(() => {});
        } catch {}

      function tone(freq, end, duration, type = "square", vol = 0.035, delay = 0) {
        if (!audio || muted) return;
        const start = audio.currentTime + delay,
          o = audio.createOscillator(),
          v = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, start);
        o.frequency.exponentialRampToValueAtTime(end, start + duration);
        v.gain.setValueAtTime(vol, start);
        v.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        o.connect(v).connect(audio.destination);
        o.start(start);
        o.stop(start + duration);

      function noise(sec, volume) {

          buffer = audio.createBuffer(1, length, audio.sampleRate),
          data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length) ** 3;
        let s = audio.createBufferSource(),
          v = audio.createGain();
        s.buffer = buffer;
        v.gain.value = volume;
        s.connect(v).connect(audio.destination);
        s.start();

      // ===== 4. 地图生成器 =====

      // 三张开场地图的中央地形。两边留出出生区，首两局抽取不同布局。
      const smallMaps = [

      const laterArenas = [

      function roundArena(round, opening) {
        if (round <= 2) {
          const layout = opening[round - 1];
          return { cols: 16, rows: 13, name: smallMaps[layout].name, layout };
        }
        const [cols, rows, name] = laterArenas[round - 3];

      function spawnPoints({ cols, rows }) {
        const y = Math.floor(rows / 2);

          [2, y],
          [cols - 3, y],

      function makeMap(seed, arena) {
        const { cols, rows, layout } = arena,
          next = rng(seed),
          map = Array(cols * rows).fill(GROUND);
        if (layout !== null) {
          const legend = { ".": GROUND, b: BRICK, s: STEEL, g: GRASS, w: WATER };
          smallMaps[layout].core.forEach((line, y) =>
            [...line].forEach((ch, x) => {
              map[(y + 1) * cols + x + 6] = legend[ch];
            }),
          );
          // 上下两翼各有一组掩体，开场可选择中路交战或从侧翼接近。
          for (const x of [3, 4, cols - 5, cols - 4])
            for (const y of [2, rows - 3]) map[y * cols + x] = [BRICK, GRASS, STEEL][layout];
        } else {
          for (let i = 0; i < Math.round(cols * rows * 0.18); i++) {
            const x = 1 + Math.floor(next() * (cols - 2)),
              y = 1 + Math.floor(next() * (rows - 2)),
              r = next();
            const type = r < 0.41 ? BRICK : r < 0.56 ? STEEL : r < 0.82 ? GRASS : WATER,
              vertical = next() < 0.5,
              len = 1 + Math.floor(next() * 4);
            for (let j = 0; j < len; j++) {
              const cx = x + (vertical ? 0 : j),
                cy = y + (vertical ? j : 0);
              if (cx < cols - 1 && cy < rows - 1) map[cy * cols + cx] = type;
            }
          }
          const lane = 2 + Math.floor(next() * (rows - 4));
          for (let x = 2; x <= cols - 3; x++) map[lane * cols + x] = GROUND;
          for (const [x, y] of spawnPoints(arena))
            for (let j = Math.min(y, lane); j <= Math.max(y, lane); j++) map[j * cols + x] = GROUND;
        }
        for (const [x, y] of spawnPoints(arena))
          for (let j = y - 3; j <= y + 3; j++)
            for (let i = Math.max(1, x - 3); i <= Math.min(cols - 2, x + 3); i++)
              map[j * cols + i] = GROUND;
        for (let y = 0; y < rows; y++)
          for (let x = 0; x < cols; x++)
            if (!x || !y || x === cols - 1 || y === rows - 1) map[y * cols + x] = STEEL;
        return map;
      }
      const cell = (x, y) => Math.floor(y / TILE) * world.arena.cols + Math.floor(x / TILE),

      function drawTile(g, type, x, y, i) {

            target.armor -= absorbed;

      // ===== 8. AI 控制器 =====
      class AIController {

        center(index) {

        firingLane(from, target) {

      // ===== 9. 联机模块：本地预测输入，主机裁定局分与增幅 =====
      class NetworkManager {
        constructor() {
          this.ws = null;
          this.role = 0;
          this.room = "";
          this.token = "";
          this.remote = emptyInput();
          this.lastPhase = "lobby";
          this.connected = false;
          this.remotes = [];
          this.addr = "ws://localhost:8080";
        }
        send(packet) {
          if (this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(packet));
        }
        close() {
          const socket = this.ws;
          this.ws = null;
          this.connected = false;
          if (socket) {
            socket.onclose = socket.onmessage = socket.onerror = null;
            socket.close();
          }
        }
        connect(action, room = "") {
          this.close();
          let socket;
          try {
            const url = new URL(this.addr);
            if (!["ws:", "wss:"].includes(url.protocol)) throw Error();
            socket = new WebSocket(url);
            this.ws = socket;
          } catch {
            return lobbyMessage("地址格式有误，请输入 ws:// 或 wss:// 地址。");
          }
          const retry = action === "resume";
          let accepted = false;
          this.remote = emptyInput();
          this.remotes = [];
          lobbyMessage("正在连接服务器…");
          socket.onopen = () =>
            this.send({ t: action, room, token: retry ? this.token : undefined });
          socket.onmessage = (e) => {
            try {
              const m = JSON.parse(e.data);
              if (m.t === "error") {
                this.close();
                if (retry) disconnectScreen(m.msg);
                else lobbyMessage(m.msg);
                return;
              }
              if (m.t === "seated") {
                accepted = true;
                this.role = m.role;
                this.token = m.token;
                this.room = m.room;
                if (retry) disconnectScreen("座位已恢复，等待另一方重新连接。");
                else waitRoom();
                return;
              }
              if (m.t === "ready") {
                this.connected = true;
                this.remotes = [];
                this.remote = emptyInput();
                if (this.role === 0) {
                  if (m.resume && world) {
                    state = this.lastPhase === "disconnected" ? "battle" : this.lastPhase;
                    restoreUI();
                    this.snapshot();
                  } else startMatch("online");
                }
                return;
              }
              if (m.t === "gone") {
                this.lost();
                return;
              }
              if (!this.connected) return;
              if (m.t === "in" && validInput(m.i)) {
                this.remoteFire ||= m.i.f;
                this.remote = m.i;
                return;
              }
              if (m.t === "snap" && this.role === 1) {
                this.apply(m);
                return;
              }
              if (this.role === 0) {
                if (m.t === "choice") choose(1, m.n, true);
                if (m.t === "pause" && state === "battle") pauseGame(true);
                if (m.t === "resumeGame" && state === "paused") resumeGame(true);
                if (m.t === "again" && state === "victory") startMatch("online");
              }
            } catch {
              this.close();
              this.lost("同步中断，请重新连接房间。");
            }
          };
          socket.onerror = () => {};
          socket.onclose = () => {
            if (socket !== this.ws) return;
            this.ws = null;
            if (accepted || retry) this.lost("与服务器的连接已断开。");
            else
              lobbyMessage("连接失败。联机需要启动本地 WebSocket 服务器，可使用配套的 server.js。");
          };
        }
        lost(msg = "对手已断线") {
          if (["battle", "draft", "victory", "paused"].includes(state)) this.lastPhase = state;
          this.connected = false;
          this.remote = emptyInput();
          disconnectScreen(msg);
        }
        snapshot() {
          if (this.role === 0 && this.connected && world)
            this.send({ t: "snap", phase: state, w: world, d: draft, b: banner });
        }
        apply(m) {
          if (!m.w || !["battle", "draft", "victory", "paused"].includes(m.phase)) return;
          const before = state,
            oldDraft = JSON.stringify(draft?.pick);
          world = m.w;
          world.tanks = world.tanks.map((t) => Object.assign(Object.create(Tank.prototype), t));
          world.bullets = world.bullets.map((b) =>
            Object.assign(Object.create(Bullet.prototype), b),
          );
          draft = m.d;
          banner = m.b;
          state = m.phase;
          if (before !== state) {
            if (state === "draft") draftCursor = [0, 0];
            particles = [];
            this.remotes = [];
            restoreUI();
          } else if (state === "draft" && oldDraft !== JSON.stringify(draft.pick)) showDraft();
          updateHUD();
        }
      }
      const validInput = (i) =>
        !!i && Number.isInteger(i.d) && i.d >= -1 && i.d <= 3 && typeof i.f === "boolean";
      // ===== 10. 游戏主循环 =====
      function simulate() {
        if (state === "draft") {
          if (mode === "online" && net.role === 1) return;
          if (draft.wait > 0 && --draft.wait === 0) endDraft();
          return;
        }
        if (state !== "battle") return;
        world.frame++;
        banner = Math.max(0, banner - 1);
        let inputs = [readPlayer(0), emptyInput()];
        if (mode === "online") {
          const local = inputs[0];
          inputs[net.role] = local;
          inputs[1 - net.role] = { d: net.remote.d, f: net.remote.f || Boolean(net.remoteFire) };
          net.remoteFire = false;
          net.send({ t: "in", i: local });
        } else inputs[1] = mode === "solo" ? ai.update() : readPlayer(1);
        world.tanks.forEach((t, i) => t.update(inputs[i]));
        world.bullets = world.bullets.filter((b) => b.update());
        particles = particles.filter((p) => {
          p.x += p.vx;
          p.y += p.vy;
          return --p.life > 0;
        });
        if (mode === "online") {
          let opp = world.tanks[1 - net.role];
          net.remotes.push({ x: opp.x, y: opp.y, dir: opp.dir });
          if (net.remotes.length > 3) net.remotes.shift();
        }
        if (world.tanks.some((t) => t.hp <= 0) && (mode !== "online" || net.role === 0))
          finishRound();
        if (world.frame % 6 === 0) updateHUD();
      }
      let prevTime = 0,
        acc = 0,
        lastFps = 0,
        frames = 0,
        lastCover = -500;
      function loop(time) {
        let delta = prevTime ? Math.min(time - prevTime, 100) : STEP;
        prevTime = time;
        acc += delta;
        while (acc >= STEP) {
          simulate();
          if (mode === "online" && net?.connected && ++ticks % 30 === 0) net.snapshot();
          acc -= STEP;
        }
        frames++;
        if (time - lastFps >= 1000) {
          fps = Math.round((frames * 1000) / (time - lastFps));
          frames = 0;
          lastFps = time;
        }
        if (!$("#viewport").hidden && world) drawBattle();
        else if (time - lastCover >= 100) {
          paintCover(time);
          lastCover = time;
        }
        if (motorGain)
          motorGain.gain.setTargetAtTime(
            !muted && state === "battle" && world.tanks.some((t) => t.vx || t.vy) ? 0.013 : 0,
            audio.currentTime,
            0.08,
          );
        requestAnimationFrame(loop);
      }
      // 缓存未改变的地形，战斗帧只重绘水纹、活动对象及发生变化的格子。
      const terrainCanvas = document.createElement("canvas"),
        foliageCanvas = document.createElement("canvas");
      for (const layer of [terrainCanvas, foliageCanvas]) {
        layer.width = field.width;
        layer.height = field.height;
      }
      const terrainBrush = terrainCanvas.getContext("2d"),
        foliageBrush = foliageCanvas.getContext("2d"),
        tileCache = [];
      let lastTerrainSeed = null;
      function drawBattle() {
        const newMap = lastTerrainSeed !== world.seed;
        lastTerrainSeed = world.seed;
        if (field.width !== world.arena.cols * TILE || field.height !== world.arena.rows * TILE) {
          for (const layer of [field, terrainCanvas, foliageCanvas]) {
            layer.width = world.arena.cols * TILE;
            layer.height = world.arena.rows * TILE;
          }
          tileCache.length = 0;
        }
        for (let i = 0; i < world.map.length; i++) {
          const type = world.map[i],
            stamp = type + 8 * (world.damage[i] || 0),
            x = (i % world.arena.cols) * 32,
            y = Math.floor(i / world.arena.cols) * 32;
          if (newMap || tileCache[i] !== stamp) {
            foliageBrush.clearRect(x, y, 32, 32);
            if (type === GRASS) grass(foliageBrush, x, y, i);
            drawTile(terrainBrush, type, x, y, i);
            tileCache[i] = stamp;
          } else if (type === WATER && world.frame % 16 === 0)
            drawTile(terrainBrush, type, x, y, i);
        }
        ctx.drawImage(terrainCanvas, 0, 0);
        for (const t of world.tanks) {
          if (t.hp <= 0) {
            sparkWreck(t);
            continue;
          }
          let pose = t;
          if (mode === "online" && t.id !== net.role && net.remotes.length) pose = net.remotes[0];
          tankSprite(ctx, pose, mode === "solo" && t.id ? "#909687" : colors[t.id]);
          if (t.shield || t.armor) {
            ctx.strokeStyle = "#9bdbeda8";
            ctx.strokeRect(pose.x - 16, pose.y - 16, 32, 32);
          }
        }
        for (const b of world.bullets) {
          const c = b.owner ? "#abe0ef" : "#ffe097";
          box(ctx, "#ad8253", b.x - Math.cos(b.a) * 5 - 1, b.y - Math.sin(b.a) * 5 - 1, 3, 3);
          box(ctx, c, b.x - 2, b.y - 2, 5, 5);
        }
        ctx.drawImage(foliageCanvas, 0, 0);
        for (let p of particles) {
          box(ctx, p.c, p.x, p.y, 3, 3);
        }
        if (banner > 0 && state === "battle") {
          ctx.save();
          ctx.globalAlpha = Math.min(1, banner / 18);
          box(ctx, "#172014e8", field.width / 2 - 87, 24, 174, 39);
          ctx.textAlign = "center";
          ctx.font = 'bold 16px "Courier New", monospace';
          ctx.fillStyle = "#f6cf62";
          ctx.fillText(`ROUND 0${world.round}  /  07`, field.width / 2, 49);
          ctx.restore();
        }
      }
      function sparkWreck(t) {
        box(ctx, "#272721", t.x - 11, t.y - 9, 22, 18);
        box(ctx, "#b47544", t.x - 5, t.y - 7, 8, 8);
      }
      // ===== 11. UI 渲染 =====
      function dlg(tag, title, body, wide = false) {
        const d = $("#dialog");
        d.className = "dialog" + (wide ? " wide" : "");
        d.innerHTML = `<div class="eyebrow">${tag}</div><h2 id="dialogTitle">${title}</h2>${body}`;
        $("#overlay").hidden = false;
        if (state !== "draft")
          d.querySelector("button:not(:disabled),input")?.focus({ preventScroll: true });
      }
      function hideDlg() {
        if ($("#overlay").contains(document.activeElement)) document.activeElement.blur();
        $("#overlay").hidden = true;
        $("#game").classList.remove("blur");
      }
      const row = (a, title, desc = "") =>
        `<button class="rowbtn" data-act="${a}">${title}${desc ? `<small>${desc}</small>` : ""}</button>`;
      const btn = (a, text, primary = false) =>
        `<button class="${primary ? "primary" : "minor"}" data-act="${a}">${text}</button>`;
      function makeMenu() {
        const subtitles = ["VS COMPUTER", "LOCAL MULTIPLAYER", "ONLINE BATTLE"],
          types = ["solo", "local", "online"];
        const feats = [
          ["三难度 AI 对战", "7 局 4 胜决战", "局间增幅选牌"],
          ["同屏双人对战", "7 局 4 胜决战", "独立分屏操控"],
          ["WebSocket 联机", "实时同步对战", "跨网络连接"],
        ];
        const tagline = ["易 / 中 / 难", "双人本地", "需要服务端"];
        $("#modes").innerHTML = names
          .map(
            (name, i) =>
              `<button class="mode" data-mode="${i}"><div class="modeTop"><canvas width="34" height="24"></canvas><span>${["1P", "2P", "NET"][i]}</span></div><strong>${name}</strong><small>${subtitles[i]}</small><div class="modeDiff">${tagline[i]}</div><ul class="modeFeats">${feats[i].map((f) => `<li>${f}</li>`).join("")}</ul><i class="go">→</i></button>`,
          )
          .join("");
        document.querySelectorAll(".mode").forEach((b, i) => {
          icon(b.querySelector("canvas"), types[i], [colors[0], colors[1], "#a6bb8d"][i]);
          b.onpointerenter = b.onfocus = () => selectMode(i);
          b.onclick = () => activate(i);
        });
        selectMode(selected);
        const tips = [
          "砖墙承受两发炮弹即摧毁；钢墙可反弹炮弹，善用反弹可奇袭对手",
          "草丛可隐蔽坦克；水面仅子弹可飞越，坦克无法通行",
          "先赢 4 局获胜；每局结束后可选择一张强化增幅卡",
          "三连发叠加穿甲弹，可快速摧毁砖墙推进战线",
          "吸血炮命中敌方越多，可回复更多 HP",
          "追踪导弹配合高速子弹，大幅提升命中率",
          "工兵坦克行进时会在身后自动建造砖墙作为掩体",
        ];
        let tipIdx = 1;
        setInterval(() => {
          const el = $("#tickerText");
          if (!el) return;
          el.classList.add("fade");
          setTimeout(() => { el.textContent = tips[tipIdx++ % tips.length]; el.classList.remove("fade"); }, 350);
        }, 5000);
      }
      function selectMode(i) {
        selected = i;
        document.querySelectorAll(".mode").forEach((b, n) => b.classList.toggle("sel", i === n));
      }
      function activate(i) {
        wakeAudio();
        if (i === 0) {
          state = "difficulty";
          dlg(
            "SOLO CAMPAIGN",
            "选择难度",
            row("d0", "简单", "主动追击，瞄准后开火") +
              row("d1", "普通", "绕墙追击，横移躲弹") +
              row("d2", "困难", "预判走位，提前闪避") +
              `<div class="actions">${btn("menu", "返回主菜单")}</div>`,
          );
        } else if (i === 1) startMatch("local");
        else {
          mode = "online";
          net = new NetworkManager();
          lobby();
        }
      }
      function lobby() {
        state = "lobby";
        dlg(
          "ONLINE BATTLE",
          "联机对战",
          `<label for="address">WebSocket 服务器地址</label><input id="address" spellcheck="false" value="ws://localhost:8080"><label for="room">房间号（加入时填写）</label><input id="room" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="6 位房间号"><div class="actions">${btn("create", "创建房间", true)}${btn("join", "加入房间")}</div><div class="notice" id="lobbyMsg" role="status"></div><p class="hint">房主下载服务端，在文件所在目录运行 <code>node server.js</code>。同一局域网内，对手填写房主的局域网 IP 和端口 8080。</p><div class="actions">${btn("download", "下载 server.js")}${btn("menu", "返回主菜单")}</div>`,
        );
      }
      function lobbyMessage(text) {
        const el = $("#lobbyMsg");
        if (el) el.textContent = text;
      }
      function downloadServer() {
        const walk = document.createTreeWalker(document, NodeFilter.SHOW_COMMENT);
        let comment;
        while ((comment = walk.nextNode())) {
          const marker = "NODE_WEBSOCKET_SERVER";
          if (comment.data.trimStart().startsWith(marker)) {
            const text = comment.data
                .slice(comment.data.indexOf(marker) + marker.length)
                .trimStart(),
              u = URL.createObjectURL(new Blob([text], { type: "text/javascript" })),
              a = document.createElement("a");
            a.href = u;
            a.download = "server.js";
            a.click();
            setTimeout(() => URL.revokeObjectURL(u), 3000);
            break;
          }
        }
      }
      function waitRoom() {
        state = "waiting";
        dlg(
          "ONLINE LOBBY",
          "等待对手加入",
          `<p>把房间号发给对手</p><div class="roomnum">${net.room}</div><p>双方就位后自动开始。</p><div class="actions">${btn("menu", "取消并返回")}</div>`,
        );
      }
      function disconnectScreen(msg) {
        state = "disconnected";
        dlg(
          "CONNECTION LOST",
          "对手已断线",
          `<p id="reason"></p><div class="actions">${btn("reconnect", "重新连接", true)}${btn("menu", "返回主菜单")}</div><div class="notice" id="lobbyMsg" role="status"></div>`,
        );
        $("#reason").textContent = msg;
      }
      function showHelp() {
        if (!["menu", "battle", "paused"].includes(state)) return;
        helpBack = state;
        if (state === "battle") {
          pauseGame();
          if (mode === "online") return;
        }
        state = "help";
        dlg(
          "FIELD MANUAL",
          "操作指南",
          `<table class="helpTable"><tr><th>操作</th><th>玩家 1</th><th>本地玩家 2</th></tr><tr><td>移动 / 朝向</td><td>W A S D</td><td>↑ ← ↓ →</td></tr><tr><td>射击</td><td>空格</td><td>Enter</td></tr><tr><td>选择增幅</td><td>A / D + 空格</td><td>← / → + Enter</td></tr></table><p>先赢 4 局即获胜。砖墙承受两发炮弹，钢墙可反弹炮弹，水面可飞越，草丛可隐蔽。</p><p>联机战斗均用 WASD 和空格，选卡按各自玩家编号操作。按 Esc 暂停或继续。</p>${btn("closeHelp", "我知道了", true)}`,
        );
      }
      function updateHUD() {
        if (!world) return;
        let h = $("#hud");
        if (!h.querySelector(".score")) {
          const player = (id) =>
            `<section><div class="playerhead" style="color:${colors[id]}"><canvas width="34" height="24" id="icon${id}"></canvas><span id="player${id}"></span></div><div class="hpval" id="hp${id}"></div><div class="hpbar"><i id="bar${id}"></i></div><div class="upgrades" id="up${id}"></div></section>`;
          h.innerHTML = `<div class="hudhead">// 战场状态</div>${player(0)}<div class="score"><small>本场局分</small><b id="scoreval"></b><small id="roundval"></small><div class="rounddots"></div></div>${player(1)}<div class="hudbottom"><span id="fps"></span><button class="minor" data-act="pause">Esc · 暂停</button></div>`;
        }
        world.tanks.forEach((t, i) => {
          icon($("#icon" + i), "solo", mode === "solo" && i ? "#a3aa98" : colors[i]);
          $("#player" + i).textContent =
            mode === "solo" && i
              ? "CPU · " + ["简单", "普通", "困难"][difficulty]
              : `P${i + 1}${mode === "online" ? (i === net.role ? " · 你" : " · 对手") : ""}`;
          $("#hp" + i).textContent =
            `HP ${Math.ceil(t.hp)} / ${t.max}` + (t.p[6] ? ` · 盾 ${t.armor}` : "");
          $("#bar" + i).style.width = `${(100 * t.hp) / t.max}%`;
          const active = t.p.map((v, j) => (v ? [j, v] : null)).filter(Boolean);
          $("#up" + i).innerHTML = active.length
            ? active
                .slice(0, 8)
                .map(
                  ([j, v]) =>
                    `<span title="${perks[j][1]} ×${v}">${perks[j][0]}${v > 1 ? "×" + v : ""}</span>`,
                )
                .join(" ") + (active.length > 8 ? ` +${active.length - 8}` : "")
            : "暂无增幅";
        });
        $("#scoreval").textContent = world.score.join(" - ");
        $("#roundval").textContent = `第 ${world.round} 局 · ${world.arena.name}`;
        $(".rounddots").innerHTML = Array.from(
          { length: 7 },
          (_, i) => `<i style="background:${colors[world.history[i]] || "transparent"}"></i>`,
        ).join("");
        $("#fps").textContent =
          `${fps} FPS · ${["单人挑战", "本地双人", "联机对战"][["solo", "local", "online"].indexOf(mode)]}`;
      }
      // 光标属于本地输入设备，主机快照只同步已确认的卡片。
      let draftCursor = [0, 0];
      function ownsDraft(id) {
        return mode === "local" || id === (mode === "online" ? net.role : 0);
      }
      function showDraft() {
        const result =
          world.result < 0
            ? "双方同归于尽 · 平局重赛"
            : `${playerName(world.result)} 赢得第 ${world.round} 局`;
        const panels = draft.offers
          .map((offer, id) => {
            const can = ownsDraft(id),
              locked = draft.pick[id] !== null,
              active = locked ? draft.pick[id] : draftCursor[id];
            const status = locked
              ? "已确认"
              : !can
                ? "等待对手确认"
                : id === 0
                  ? "A / D 切换 · 空格确认"
                  : "← / → 切换 · Enter 确认";
            const cards = offer
              .map((n, i) => {
                const current = active === i && (can || locked);
                return `<button class="perk ${current ? (locked ? "chosen" : "cursor") : ""}" ${!can || locked ? "disabled" : ""} data-act="pick${id}${i}"><kbd>${current ? (locked ? "✓ 已确认" : "▶ 当前") : "　"}</kbd><span>${perks[n][0]}</span><b>${perks[n][1]}</b><small>${perks[n][2]}</small></button>`;
              })
              .join("");
            return `<section><h3>${playerName(id)} · ${status}</h3><div class="picks">${cards}</div></section>`;
          })
          .join("");
        dlg(
          "ROUND COMPLETE",
          "局间增幅",
          `<p>${result}　${world.score.join(" - ")}</p><div class="drafts">${panels}</div><p class="hint">双方确认后开始下一局。增幅保留至本场结束。</p>`,
          true,
        );
        $("#dialog").tabIndex = -1;
        $("#dialog").focus({ preventScroll: true });
      }
      function playerName(id) {
        return mode === "solo" && id === 1 ? "电脑" : `玩家 ${id + 1}`;
      }
      function victory() {
        const id = world.score[0] === 4 ? 0 : 1;
        dlg(
          "MATCH COMPLETE",
          `${playerName(id)} 获胜`,
          `<div class="resultscore">${world.score.join(" - ")}</div><p>率先拿下四局，赢得本场对决。</p><div class="actions">${btn("again", "再来一场", true)}${btn("menu", "返回主菜单")}</div>`,
        );
      }
      function showPause() {
        $("#game").classList.add("blur");
        dlg(
          "GAME PAUSED",
          "游戏已暂停",
          `<div class="actions">${btn("resume", "继续游戏", true)}${btn("menu", "返回主菜单")}</div>`,
        );
      }
      // ===== 12. 输入管理：最近按下的方向优先，切换界面时清除按键 =====
      const held = new Set(),
        tapped = new Set();
      function clearInput() {
        held.clear();
        tapped.clear();
      }
      const dirs = [
        ["KeyW", "KeyD", "KeyS", "KeyA"],
        ["ArrowUp", "ArrowRight", "ArrowDown", "ArrowLeft"],
      ];
      function readPlayer(id) {
        let d = -1;
        for (let key of held) {
          let index = dirs[id].indexOf(key);
          if (index !== -1) d = index;
        }
        const key = id ? "Enter" : "Space",
          pressed = tapped.delete(key);
        return { d, f: held.has(key) || pressed };
      }
      function handleAction(a) {
        wakeAudio();
        if (a === "menu") return mainMenu();
        if (/^d[0-2]$/.test(a)) {
          difficulty = Number(a[1]);
          return startMatch("solo");
        }
        if (a === "pause") return pauseGame();
        if (a === "resume") return resumeGame();
        if (a === "again") {
          if (mode === "online" && net.role === 1) return net.send({ t: "again" });
          return startMatch(mode);
        }
        if (a === "closeHelp") {
          if (helpBack === "battle") {
            state = "paused";
            resumeGame();
          } else if (helpBack === "paused") {
            state = "paused";
            showPause();
          } else mainMenu();
          return;
        }
        if (a.startsWith("pick")) return choose(+a[4], +a[5]);
        if (a === "download") return downloadServer();
        if (a === "reconnect") return net.connect("resume", net.room);
        if (a === "create" || a === "join") {
          let room = $("#room").value.trim();
          if (a === "join" && !/^\d{6}$/.test(room)) return lobbyMessage("请输入 6 位数字房间号。");
          net.addr = $("#address").value.trim();
          net.connect(a, room);
        }
      }
      document.addEventListener("click", (e) => {
        let b = e.target.closest("[data-act]");
        if (b && !b.disabled) handleAction(b.dataset.act);
      });
      window.addEventListener("keydown", (e) => {
        let k = e.code;
        wakeAudio();
        if (k === "Escape") {
          e.preventDefault();
          if (e.repeat) return;
          if (state === "battle") pauseGame();
          else if (state === "paused") resumeGame();
          else if (state === "help") handleAction("closeHelp");
          else if (["difficulty", "lobby", "waiting", "disconnected", "victory"].includes(state))
            mainMenu();
          return;
        }
        if (e.target.matches("input")) return;
        if (!$("#overlay").hidden && k === "Tab") {
          let items = [...$("#dialog").querySelectorAll("input,button:not(:disabled)")];
          if (
            items.length &&
            ((e.shiftKey && document.activeElement === items[0]) ||
              (!e.shiftKey && document.activeElement === items.at(-1)))
          ) {
            e.preventDefault();
            items[e.shiftKey ? items.length - 1 : 0].focus();
          }
          return;
        }
        if (state === "menu") {
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) {
            e.preventDefault();
            selectMode((selected + (["ArrowLeft", "ArrowUp"].includes(k) ? 2 : 1)) % 3);
            document.querySelector(`[data-mode="${selected}"]`).focus();
          }
          if (k === "Enter" && !e.target.closest(".utility")) {
            e.preventDefault();
            if (!e.repeat) activate(selected);
          }
          return;
        }
        if (state === "draft") {
          const controls = [
            ["KeyA", "KeyD", "Space"],
            ["ArrowLeft", "ArrowRight", "Enter"],
          ];
          for (let id = 0; id < 2; id++) {
            const action = controls[id].indexOf(k);
            if (action < 0) continue;
            e.preventDefault();
            if (e.repeat || !ownsDraft(id) || draft.pick[id] !== null) break;
            if (action === 2) choose(id, draftCursor[id]);
            else {
              draftCursor[id] = (draftCursor[id] + (action === 0 ? 2 : 1)) % 3;
              showDraft();
            }
            break;
          }
          return;
        }
        if (state === "battle" && [...dirs.flat(), "Space", "Enter"].includes(k)) {
          e.preventDefault();
          if (!e.repeat) {
            held.add(k);
            if (k === "Space" || k === "Enter") tapped.add(k);
          }
        } else if (
          ["difficulty", "paused", "victory"].includes(state) &&
          ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)
        ) {
          e.preventDefault();
          const items = [...$("#dialog").querySelectorAll("button")],
            inc = ["ArrowUp", "ArrowLeft"].includes(k) ? -1 : 1;
          items[
            (items.indexOf(document.activeElement) + inc + items.length) % items.length
          ]?.focus();
        }
      });
      window.addEventListener("keyup", (e) => held.delete(e.code));
      window.addEventListener("blur", () => {
        clearInput();
        if (state === "battle" && mode !== "online") pauseGame();
      });
      // ===== 13. 游戏状态机 =====
      function mainMenu() {
        net?.close();
        net = null;
        world = null;
        draft = null;
        mode = "solo";
        state = "menu";
        clearInput();
        hideDlg();
        $("#menu").hidden = false;
        $("#viewport").hidden = true;
        $("#systemStatus").textContent = "SYSTEM READY";
        $("#footerKeys").textContent = "支持键盘与鼠标选择模式";
        $("#help").disabled = false;
        selectMode(selected);
      }
      function startMatch(which) {
        mode = which;
        world = { random: seedValue(), score: [0, 0], history: [], round: 1, tanks: [] };
        const first = Math.floor(rand() * smallMaps.length);
        world.opening = [first, (first + 1 + Math.floor(rand() * 2)) % smallMaps.length];
        nextRound();
      }
      function nextRound() {
        let powers = world.tanks.map((t) => t.p);
        world.round = world.history.length + 1;
        world.seed = Math.floor(rand() * 4294967296);
        world.arena = roundArena(world.round, world.opening);
        world.map = makeMap(world.seed, world.arena);
        world.damage = {};
        world.frame = 0;
        world.bullets = [];
        world.tanks = [0, 1].map((i) => new Tank(i, powers[i] || Array(perks.length).fill(0)));
        ai = new AIController();
        state = "battle";
        draft = null;
        particles = [];
        banner = 100;
        clearInput();
        restoreUI();
        if (mode === "online") net.snapshot();
      }
      function finishRound() {
        let [a, b] = world.tanks;
        let winner = a.hp <= 0 && b.hp <= 0 ? -1 : a.hp <= 0 ? 1 : 0;
        world.result = winner;
        if (winner >= 0) {
          world.score[winner]++;
          world.history.push(winner);
        }
        sound("boom");
        clearInput();
        if (world.score.includes(4)) {
          state = "victory";
          draft = null;
          victory();
          sound("win");
        } else {
          state = "draft";
          draft = {
            offers: [cardsFor(0), cardsFor(1)],
            pick: [null, null],

            wait: 0,
          };
          draftCursor = [0, 0];
          if (mode === "solo") draft.pick[1] = ai.choosePerk(draft.offers[1]);
          showDraft();
        }
        updateHUD();
        if (mode === "online") net.snapshot();
      }
      function pauseGame(remote = false) {
        if (state !== "battle") return;
        clearInput();
        if (mode === "online" && net.role === 1 && !remote) return net.send({ t: "pause" });
        state = "paused";
        showPause();
        if (mode === "online") net.snapshot();
      }
      function resumeGame(remote = false) {
        if (state !== "paused") return;
        if (mode === "online" && net.role === 1 && !remote) return net.send({ t: "resumeGame" });
        state = "battle";
        clearInput();
        hideDlg();
        if (mode === "online") net.snapshot();
      }
      function fitViewport() {
        let view = $("#viewport"),
          s = Math.min(
            1,
            $("#menu").parentElement.clientWidth / 1032,
            ($("#shell").getBoundingClientRect().width -
              parseFloat(getComputedStyle($("#shell")).paddingLeft) * 2) /
              1032,
          );
        view.style.width = `${1032 * s}px`;
        view.style.height = `${672 * s}px`;
        $("#game").style.transform = `scale(${s})`;
      }
      function restoreUI() {
        clearInput();
        $("#menu").hidden = true;
        $("#viewport").hidden = false;
        $("#systemStatus").textContent = "BATTLE SYSTEM";
        $("#footerKeys").textContent =
          mode === "local"
            ? "P1　WASD + 空格　 /　 P2　方向键 + Enter"
            : "WASD 移动　 /　 空格射击　 /　 Esc 暂停";
        $("#help").disabled = mode === "online";
        fitViewport();
        hideDlg();
        updateHUD();
        if (state === "paused") showPause();
        else if (state === "victory") victory();
        else if (state === "draft") showDraft();
      }
      // ===== 14. 初始化与入口 =====
      $("#sound").onclick = () => {
        wakeAudio();
        muted = !muted;
        $("#sound").setAttribute("aria-pressed", String(!muted));
        $("#sound span").textContent = muted ? "静音" : "音效";
        icon($("#sound canvas"), "sound", "#d2d7c3");
        if (!muted) sound("pick");
      };
      $("#help").onclick = showHelp;
      for (const c of document.querySelectorAll("[data-icon]"))
        icon(c, c.dataset.icon, c.dataset.icon === "logo" ? "#323728" : "#c4cbb7");
      makeMenu();
      paintCover(0);
      window.addEventListener("resize", fitViewport);
      requestAnimationFrame(loop);
    </script>
  </body>
